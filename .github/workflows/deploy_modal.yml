name: Deploy Modal Serverless TTS

on:
  workflow_dispatch:
    inputs:
      modal_token_id:
        description: 'Modal Token ID (ak-...)'
        required: true
        type: string
      modal_token_secret:
        description: 'Modal Token Secret (as-...)'
        required: true
        type: string

jobs:
  deploy-modal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Modal & FastAPI
        run: pip install modal fastapi

      - name: Deploy to Modal Cloud
        env:
          MODAL_TOKEN_ID: ${{ inputs.modal_token_id }}
          MODAL_TOKEN_SECRET: ${{ inputs.modal_token_secret }}
        run: |
          modal deploy modal_app.py
